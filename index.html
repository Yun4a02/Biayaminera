<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIAYA WITHDRAW MINERA</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-body: #020908;
            --bg-radial-a: rgba(45, 255, 143, 0.17);
            --bg-radial-b: rgba(0, 200, 255, 0.12);
            --panel-bg: rgba(7, 19, 21, 0.94);
            --panel-soft: rgba(255, 255, 255, 0.045);
            --panel-deep: rgba(0, 0, 0, 0.42);
            --gold-main: #2dff8f;
            --gold-light: #b9fff4;
            --gold-mid: #00c8ff;
            --gold-dark: #007a8f;
            --danger: #ff4d5c;
            --danger-dark: #8b101a;
            --success: #34ff9f;
            --text-main: #f2fffb;
            --text-soft: rgba(242, 255, 251, 0.72);
            --text-muted: rgba(242, 255, 251, 0.52);
            --border-neon: rgba(45, 255, 143, 0.38);
            --border-soft: rgba(0, 200, 255, 0.18);
            --shadow-main: 0 24px 70px rgba(0, 0, 0, 0.56);
            --radius-lg: 26px;
            --radius-md: 18px;
            --radius-sm: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--gold-main) rgba(255, 255, 255, 0.04);
        }

        *::-webkit-scrollbar {
            width: 11px;
            height: 11px;
        }

        *::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.045);
            border-radius: 999px;
            border: 1px solid rgba(45, 255, 143, 0.08);
        }

        *::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--gold-light), var(--gold-main), var(--gold-dark));
            border-radius: 999px;
            border: 3px solid rgba(7, 7, 6, 0.96);
            box-shadow: 0 0 16px rgba(45, 255, 143, 0.34);
        }

        *::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #d9fff8, #00d5ff, #007a8f);
            box-shadow: 0 0 22px rgba(0, 200, 255, 0.36);
        }

        body {
            position: relative;
            min-height: 100vh;
            color: var(--text-main);
            padding: 34px 18px;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 15% 0%, var(--bg-radial-a), transparent 34%),
                radial-gradient(circle at 85% 12%, rgba(255, 255, 255, 0.05), transparent 22%),
                radial-gradient(circle at 50% 100%, var(--bg-radial-b), transparent 38%),
                linear-gradient(145deg, #020908 0%, #062322 45%, #020d12 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(45, 255, 143, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 200, 255, 0.045) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle at center, rgba(0,0,0,0.8), transparent 76%);
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: -40%;
            z-index: -1;
            background: conic-gradient(from 180deg, transparent, rgba(45, 255, 143, 0.06), transparent, rgba(255,255,255,0.025), transparent);
            animation: bgRotate 18s linear infinite;
            pointer-events: none;
        }

        @keyframes bgRotate {
            to { transform: rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: min(1200px, 100%);
            margin: 0 auto;
        }

        .header-section {
            position: relative;
            text-align: center;
            margin-bottom: 28px;
            padding: 28px 20px;
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-lg);
            background:
                radial-gradient(circle at 50% 0%, rgba(185, 255, 244, 0.14), transparent 45%),
                linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.012)),
                rgba(0,0,0,0.42);
            box-shadow: var(--shadow-main), inset 0 1px 0 rgba(255,255,255,0.09);
            overflow: hidden;
        }

        .header-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(185, 255, 244, 0.14), transparent);
            transform: translateX(-120%);
            animation: headerShine 4.8s linear infinite;
        }

        @keyframes headerShine {
            0% { transform: translateX(-120%); }
            56%, 100% { transform: translateX(120%); }
        }

        .main-title {
            position: relative;
            z-index: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.75rem, 4.5vw, 3.2rem);
            letter-spacing: clamp(4px, 1vw, 10px);
            text-transform: uppercase;
            color: var(--gold-main);
            line-height: 1.1;
        }

        .main-title span {
            display: inline-block;
            animation: goldBlink 2.8s infinite ease-in-out;
        }

        @keyframes goldBlink {
            0%, 100% {
                color: rgba(185, 255, 244, 0.42);
                opacity: 0.62;
                text-shadow: none;
            }
            50% {
                color: var(--gold-light);
                opacity: 1;
                text-shadow:
                    0 0 12px rgba(185, 255, 244, 0.65),
                    0 0 26px rgba(0, 200, 255, 0.55),
                    0 0 44px rgba(0, 200, 255, 0.24);
            }
        }

        .stats-bar {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }

        .stat-item {
            position: relative;
            overflow: hidden;
            min-height: 168px;
            padding: 24px 18px 20px;
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-lg);
            background:
                radial-gradient(circle at top, rgba(185, 255, 244, 0.10), transparent 42%),
                linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015)),
                var(--panel-bg);
            box-shadow:
                0 18px 44px rgba(0,0,0,0.42),
                inset 0 1px 0 rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .stat-item::before {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            top: -82px;
            right: -72px;
            border-radius: 50%;
            background: rgba(0, 200, 255, 0.14);
            filter: blur(2px);
        }

        .stat-item::after {
            content: "";
            position: absolute;
            inset: 9px;
            border: 1px dashed rgba(185, 255, 244, 0.13);
            border-radius: calc(var(--radius-lg) - 8px);
            pointer-events: none;
        }

        .stat-label {
            position: relative;
            z-index: 1;
            font-size: 0.82rem;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 1.7px;
            font-weight: 800;
        }

        .stat-value {
            position: relative;
            z-index: 1;
            max-width: 100%;
            font-size: clamp(1.85rem, 3.2vw, 2.65rem);
            font-weight: 900;
            color: var(--gold-light);
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.52);
            overflow-wrap: anywhere;
            line-height: 1.1;
        }

        .btn-copy-bottom {
            position: relative;
            z-index: 1;
            background:
                linear-gradient(135deg, rgba(185, 255, 244, 0.09), rgba(215, 173, 53, 0.04));
            border: 1px solid rgba(185, 255, 244, 0.22);
            color: var(--gold-light);
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 999px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.22s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .btn-copy-bottom:hover {
            color: #02110d;
            border-color: var(--gold-light);
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main), var(--gold-mid));
            box-shadow: 0 0 20px rgba(45, 255, 143, 0.38);
            transform: translateY(-1px);
        }

        #toast {
            visibility: hidden;
            min-width: 300px;
            max-width: calc(100vw - 32px);
            background:
                radial-gradient(circle at top left, rgba(185, 255, 244, 0.18), transparent 42%),
                rgba(10, 9, 7, 0.96);
            color: var(--gold-light);
            text-align: center;
            border-radius: 16px;
            border: 1px solid var(--border-neon);
            padding: 15px 22px;
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 26px;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            box-shadow:
                0 20px 44px rgba(0, 0, 0, 0.72),
                0 0 24px rgba(0, 200, 255, 0.24);
        }

        #toast.show {
            visibility: visible;
            animation: toastIn 0.35s ease, toastOut 0.45s ease 2.55s;
        }

        @keyframes toastIn {
            from { bottom: 0; opacity: 0; transform: translateX(-50%) scale(0.94); }
            to { bottom: 26px; opacity: 1; transform: translateX(-50%) scale(1); }
        }

        @keyframes toastOut {
            from { bottom: 26px; opacity: 1; transform: translateX(-50%) scale(1); }
            to { bottom: 0; opacity: 0; transform: translateX(-50%) scale(0.96); }
        }

        .filter-container {
            display: grid;
            grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr);
            gap: 18px;
            margin-bottom: 26px;
        }

        .filter-col {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-lg);
            background:
                radial-gradient(circle at top left, rgba(45, 255, 143, 0.08), transparent 44%),
                var(--panel-bg);
            box-shadow: 0 18px 44px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .filter-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 0.92rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-left: 2px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .filter-label::before {
            content: "◆";
            color: var(--gold-main);
            font-size: 0.68rem;
            text-shadow: 0 0 12px rgba(45, 255, 143, 0.58);
        }

        .filter-box {
            background:
                linear-gradient(145deg, rgba(0,0,0,0.56), rgba(255,255,255,0.018));
            border: 1px solid rgba(0, 200, 255, 0.22);
            border-radius: var(--radius-md);
            padding: 14px;
            min-height: 152px;
            max-height: 190px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            align-content: flex-start;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.045);
        }

        .tag {
            background:
                linear-gradient(135deg, var(--gold-light), var(--gold-main), var(--gold-mid));
            color: #02110d;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 0.86rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            border: 1px solid rgba(185, 255, 244, 0.52);
            box-shadow: 0 8px 18px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.34);
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .tag i {
            font-size: 0.68rem;
            cursor: pointer;
            opacity: 0.7;
        }

        .input-module {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(185, 255, 244, 0.10), transparent 42%),
                var(--panel-bg);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-main), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .input-module::before {
            content: "UPLOAD PANEL";
            position: absolute;
            right: 18px;
            top: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 2px;
            color: rgba(185, 255, 244, 0.22);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn-menu {
            min-height: 58px;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(135deg, rgba(255, 240, 163, 0.075), rgba(0,0,0,0.36));
            border: 1px solid rgba(185, 255, 244, 0.32);
            border-radius: var(--radius-md);
            color: var(--gold-light);
            padding: 15px 18px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.82rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.24s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            letter-spacing: 0.7px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
        }

        .btn-menu::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transform: translateX(-110%);
            transition: 0.55s ease;
        }

        .btn-menu:hover::before {
            transform: translateX(110%);
        }

        .btn-menu:hover {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main), var(--gold-mid));
            color: #02110d;
            border-color: var(--gold-light);
            box-shadow: 0 0 28px rgba(45, 255, 143, 0.34);
            transform: translateY(-2px);
        }

        .btn-menu i {
            font-size: 1rem;
        }

        .btn-reset {
            border-color: rgba(255, 77, 92, 0.42) !important;
            color: #ffb3b9 !important;
            background:
                linear-gradient(135deg, rgba(255, 77, 92, 0.085), rgba(0,0,0,0.36)) !important;
        }

        .btn-reset:hover {
            background: linear-gradient(135deg, #ff9aa3, var(--danger), var(--danger-dark)) !important;
            color: #fff !important;
            box-shadow: 0 0 28px rgba(255, 77, 92, 0.34) !important;
            border-color: #ffb3b9 !important;
        }

        @media (max-width: 860px) {
            body {
                padding: 18px 12px;
            }

            .stats-bar,
            .menu-grid,
            .filter-container {
                grid-template-columns: 1fr;
            }

            .header-section {
                padding: 22px 14px;
                margin-bottom: 20px;
            }

            .stat-item {
                min-height: 145px;
            }

            .filter-box {
                max-height: 230px;
            }
        }

        @media (max-width: 480px) {
            .main-title {
                letter-spacing: 3px;
                font-size: 1.45rem;
            }

            .stat-value {
                font-size: 1.7rem;
            }

            .btn-menu {
                font-size: 0.74rem;
                padding: 13px;
            }
        }

<body>

    <div class="bg-logo" aria-hidden="true"></div>

    <div class="container">
        <div class="header-section">
            <h1 class="main-title" id="blinkTitle"></h1>
        </div>

        <!-- Dashboard Stats -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">Total Transaksi</span>
                <span class="stat-value" id="valTransaksi">0</span>
                <button class="btn-copy-bottom" onclick="copyValue('valTransaksi')"><i class="fas fa-copy"></i> Copy</button>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Amount</span>
                <span class="stat-value" id="valAmount">Rp 0</span>
                <button class="btn-copy-bottom" onclick="copyValue('valAmount')"><i class="fas fa-copy"></i> Copy</button>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Fee</span>
                <span class="stat-value" id="valFee">Rp 0</span>
                <button class="btn-copy-bottom" onclick="copyValue('valFee')"><i class="fas fa-copy"></i> Copy</button>
            </div>
        </div>

        <!-- Filter Tags -->
        <div class="filter-container">
            <div class="filter-col">
                <span class="filter-label">Filter Status</span>
                <div class="filter-box" id="statusTags">
                    <span class="tag">success <i class="fas fa-times"></i></span>
                </div>
            </div>
            <div class="filter-col">
                <span class="filter-label">Filter Remark (UserID)</span>
                <div class="filter-box" id="remarkTags"></div>
            </div>
        </div>

        <div class="input-module">
            <div class="menu-grid">
                <button class="btn-menu" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-file-upload"></i> Upload & Process Excel
                </button>
                <button class="btn-menu btn-reset" onclick="clearAll()">
                    <i class="fas fa-undo-alt"></i> Reset Bot
                </button>
            </div>
            <input type="file" id="fileInput" style="display:none" accept=".xlsx, .xls, .csv, .ods">
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast"></div>

    <script>
        // Animasi Judul
        const textStr = "BIAYA WITHDRAW MINERA";
        const titleEl = document.getElementById('blinkTitle');
        textStr.split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.style.animationDelay = (i * 0.12) + 's';
            titleEl.appendChild(span);
        });

        // Format angka dengan koma
        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }

        // Fungsi Salin ke Clipboard (Menyimpan Koma)
        function copyValue(elementId) {
            const text = document.getElementById(elementId).innerText;
            const cleanText = text.replace('Rp ', '');
            navigator.clipboard.writeText(cleanText).then(() => {
                showToast("✨ DATA SECURED TO CLIPBOARD : " + cleanText);
            });
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // FUNGSI UTAMA FILTER BOT
        function runBotFilter(rawData) {
            const lines = rawData.split('\n');
            let totalAmount = 0;
            let totalFee = 0;
            let uniqueRemarks = new Set();
            let filterCount = 0;

            lines.forEach((line) => {
                const parts = line.split(';');
                if (parts.length >= 16) {
                    const statusVal = (parts[6] || "").trim().toLowerCase(); 
                    const remarkRaw = (parts[15] || "").trim();               

                    if (statusVal === "success" && remarkRaw !== "") {
                        // Ambil UserID batas |
                        const remarkVal = remarkRaw.split('|')[0].trim();
                        const amountVal = parseFloat(parts[2]) || 0; 
                        const feeVal = parseFloat(parts[3]) || 0;    

                        totalAmount += amountVal;
                        totalFee += feeVal;
                        filterCount++;
                        uniqueRemarks.add(remarkVal);
                    }
                }
            });
            
            document.getElementById('valTransaksi').innerText = formatNumber(filterCount);
            document.getElementById('valAmount').innerText = "Rp " + formatNumber(totalAmount);
            document.getElementById('valFee').innerText = "Rp " + formatNumber(totalFee);
            
            if(filterCount > 0) {
                updateRemarkTags(uniqueRemarks);
            } else {
                document.getElementById('remarkTags').innerHTML = "";
            }
        }

        function updateRemarkTags(remarks) {
            const container = document.getElementById('remarkTags');
            container.innerHTML = "";
            remarks.forEach(rem => {
                const tag = document.createElement('span');
                tag.className = 'tag';
                tag.innerHTML = `${rem} <i class="fas fa-times"></i>`;
                container.appendChild(tag);
            });
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });

                let formattedText = "";
                rows.forEach((row, index) => {
                    if (index === 0) return; 
                    let lineParts = [];
                    for(let i=0; i<=15; i++) {
                        lineParts.push(row[i] !== undefined ? row[i] : "");
                    }
                    formattedText += lineParts.join(';') + "\n";
                });

                runBotFilter(formattedText.trim());
            };
            reader.readAsArrayBuffer(file);
        });

        function clearAll() {
            document.getElementById('valTransaksi').innerText = '0';
            document.getElementById('valAmount').innerText = 'Rp 0';
            document.getElementById('valFee').innerText = 'Rp 0';
            document.getElementById('remarkTags').innerHTML = "";
            document.getElementById('fileInput').value = '';
        }
    </script>
</body>
